[project]
name = "mini-loghouse-poc"
version = "0.1.0"
description = "chDB + Refreshable MV based ClickHouse cluster registration & observation PoC"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chdb==4.4.0",
    "chdb-core==26.9.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires scripts/testenv.py nodes running"]
addopts = "-m 'not integration'"
